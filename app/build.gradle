plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taki.getgo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.taki.getgo'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '2.4.0'
        // v2.3.4 per-ABI builds: ONE codebase, five artifacts.
        // By default (no -PtargetAbi) all four ABIs shipped by
        // youtubedl-android are packaged = the universal APK.
        // With -PtargetAbi=<abi> only that ABI's native libs
        // (yt-dlp + Python + FFmpeg) are packaged, so the APK
        // shrinks with zero code, function or design change.
        // Every variant keeps the SAME versionCode, so a user
        // can switch universal <-> slim without Android
        // refusing the install as a downgrade.
        ndk {
            if (project.hasProperty('targetAbi')) {
                abiFilters project.property('targetAbi')
            } else {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // v2: the ONLY external dependencies, both fully open source
    // and both GPL-3.0 (see README.md "Licenses in v2").
    // - library: youtubedl-android wrapper around the yt-dlp
    //   executable + bundled Python 3.8 (lazy extractors).
    // - ffmpeg: FFmpeg for yt-dlp merging and --extract-audio.
    // aria2c is deliberately NOT included: yt-dlp's own downloader
    // is enough for v2, and every extra native binary is size
    // and maintenance cost.
    // Version 0.18.1 is the version shown in the upstream README
    // at the time of writing; it is pinned, never a floating range.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
